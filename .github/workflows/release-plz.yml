name: release-plz

on:
  push:
    branches: [master]

permissions: {}

jobs:
  # Opens or updates the release PR. PRs made with GITHUB_TOKEN don't trigger
  # CI; set a RELEASE_PLZ_TOKEN secret (GitHub App token or PAT) so they do.
  release-plz-pr:
    if: github.repository_owner == 'macalinao' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          skipPush: true
      # cargo-semver-checks comes from the flake's nixpkgs so it reads the
      # rustdoc JSON of the dev shell's rustc.
      - name: Install release-plz
        run: |
          nix profile install nixpkgs#release-plz
          nix profile install --inputs-from . nixpkgs#cargo-semver-checks
      - uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      # The semver check builds the published crates, which link libav* and
      # libplacebo, so this also runs in the nix dev shell.
      - name: release-plz release-pr
        run: >-
          nix develop --command release-plz release-pr
          --git-token "$GITHUB_TOKEN"
          --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  # Publishes unpublished versions to crates.io, tags them and creates the
  # GitHub release. The token comes from trusted publishing; a crate's first
  # publish can't use it, so CARGO_REGISTRY_TOKEN (a secret) covers that.
  # The crates link libav* and libplacebo, so publishing (which builds each
  # package) runs in the nix dev shell. With release_always = false it only
  # publishes when the commit comes from a merged release PR (a `release-plz-`
  # branch), which it looks up through the GitHub API.
  release-plz-release:
    if: github.repository_owner == 'macalinao' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          skipPush: true
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        continue-on-error: true
      - name: Install release-plz
        run: nix profile install nixpkgs#release-plz
      - name: release-plz release
        run: nix develop --command release-plz release --git-token "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
