name: release-plz

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  # Opens or updates the release PR. PRs made with GITHUB_TOKEN don't trigger
  # CI; set a RELEASE_PLZ_TOKEN secret (GitHub App token or PAT) so they do.
  release-plz-pr:
    if: github.repository_owner == 'talaagent' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # GITHUB_TOKEN failed to create a release branch after workflow edits.
      # Stop before release-plz can close the existing PR as a recovery action.
      - name: Require release PR credentials
        env:
          HAS_RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
        run: |
          if [ "$HAS_RELEASE_PLZ_TOKEN" != true ]; then
            echo "::error::Configure RELEASE_PLZ_TOKEN with repository contents, pull-request, and workflow write permissions. GITHUB_TOKEN could not create the release branch. See CONTRIBUTING.md."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          skipPush: true
      # cargo-semver-checks comes from the flake's nixpkgs so it reads the
      # rustdoc JSON of the dev shell's rustc.
      - name: Install release-plz
        run: |
          nix profile install nixpkgs#release-plz
          nix profile install --inputs-from . nixpkgs#cargo-semver-checks
      - uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # The semver check builds the published crates, which link libav* and
      # libplacebo, so this also runs in the nix dev shell.
      - name: release-plz release-pr
        run: >-
          nix develop --command release-plz release-pr
          --git-token "$GITHUB_TOKEN"
          --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Publishes unpublished versions to crates.io, tags them and creates the
  # GitHub release. The token comes from trusted publishing; a crate's first
  # publish can't use it, so CARGO_REGISTRY_TOKEN (a secret) covers that.
  # The crates link libav* and libplacebo, so publishing (which builds each
  # package) runs in the nix dev shell. With release_always = false it only
  # publishes when the commit comes from a merged release PR (a `release-plz-`
  # branch), which it looks up through the GitHub API.
  release-plz-release:
    concurrency:
      group: release-plz-publish-${{ github.ref }}
      cancel-in-progress: false
    if: github.repository_owner == 'talaagent' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          skipPush: true
      # An OIDC token can only publish existing trusted crates. If the
      # workspace adds a crate, its first upload needs the registry secret.
      - name: Check for first publications
        id: registry
        run: |
          metadata=$(nix develop --command cargo metadata --no-deps --format-version 1)
          bootstrap=false
          while read -r name; do
            code=$(curl --silent --show-error --retry 3 -o /dev/null -w '%{http_code}' \
              -H "User-Agent: $GITHUB_REPOSITORY release workflow" "https://crates.io/api/v1/crates/$name")
            case "$code" in
              200) ;;
              404)
                bootstrap=true
                echo "::notice::$name needs its first publication using CARGO_REGISTRY_TOKEN."
                echo "- $name needs bootstrap publication in the next merged release PR." >> "$GITHUB_STEP_SUMMARY"
                ;;
              *) echo "::error::crates.io lookup for $name returned HTTP $code"; exit 1 ;;
            esac
          done < <(jq -r '.packages[] | select(.publish != []) | .name' <<< "$metadata")
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.registry.outputs.bootstrap != 'true'
        id: auth
        continue-on-error: true
      - name: Verify publishing credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::No crates.io credentials. Configure trusted publishing for every crate, or CARGO_REGISTRY_TOKEN for first publication. See CONTRIBUTING.md."
            exit 1
          fi
      - name: Install release-plz
        run: nix profile install nixpkgs#release-plz
      - name: release-plz release
        run: nix develop --command release-plz release --git-token "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
