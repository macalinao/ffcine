name: CI

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          skipPush: true

      - name: cargo fmt
        run: nix develop --command cargo fmt --all --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo doc
        run: nix develop --command cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

      # No GPU on the runner: tests needing one skip themselves.
      - name: cargo test
        run: nix develop --command cargo test --workspace

      # Catches a broken crates.io package before release-plz publishes it.
      - name: cargo publish --dry-run
        run: nix develop --command cargo publish --workspace --dry-run --locked

      - name: nix build
        run: nix build .#ffcine --print-build-logs

      - name: nix flake check
        run: nix flake check --print-build-logs

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # The GPU stack is Linux only; the audio path has to keep building and passing on a Mac.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: cargo build (audio)
        run: nix develop .#audio --command cargo build -p ffcine-cli --no-default-features --features audio

      - name: cargo test (audio)
        run: nix develop .#audio --command cargo test -p ffcine-audio

  portable-docs:
    name: docs.rs portable builds
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Deliberately outside Nix: prove these docs need no native headers/libraries.
      - name: Portable facade
        run: cargo doc -p ffcine --no-default-features --no-deps --locked
      - name: FFI documentation snapshot
        run: cargo doc -p ffcine-libplacebo-sys --no-default-features --no-deps --locked
        env:
          DOCS_RS: "1"

  # The one check branch protection requires.
  ci:
    if: always()
    needs: [nix, deny, macos, portable-docs]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
