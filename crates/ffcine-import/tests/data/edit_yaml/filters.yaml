# Per-clip filters and a vertical output, for the render round-trip test (crates/ffcine/tests).
sources:
  dji_dir: media
  iphone_dir: media

output:
  fps: 24000/1001
  preview: {width: 1080, height: 1920, max_punch: 1.12}
  final: {width: 1080, height: 1920, max_punch: 1.12}

grade:
  lut: none

looks:
  night: {gamma: 1.22, denoise: 3}

shots:
  - {id: still, src: dji:0001, in: 0, out: 2}
  - {id: shaky, src: dji:0001, in: 2, out: 5, stabilize: {smoothing: 30}}
  - {id: walk, src: dji:0002, in: 0, out: 3, stabilise: true, crop_x: 0.3,
     punch: [{at: 1.0, to: 2.0, zoom: 1.3}]}
  - {id: dark, src: dji:0002, in: 3, out: 6, look: night, grade: {exposure: 0.5}}
  - {id: ramp, src: dji:0001, in: 5, out: 11, ramp: [[0, 1], [0.5, 3], [1, 1]],
     denoise: {temporal: {radius: 3, strength: 5}}}
