[package]
name = "ffcine-comp"
description = "Compositions (ffcine.comp/1): canvas and layers with animated parameters, lowered to GPU layers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/ffcine-comp"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
ffcine-core.workspace = true
# Per-layer grade: the project, `grade_for` and shader loading.
ffcine-hooks.workspace = true
# Layer, Grade, Hook, BlendMode and the generated shaders (no backend features).
ffcine-render.workspace = true
ffcine-text.workspace = true
ffcine-timeline.workspace = true
serde_json.workspace = true
# Digests of sampled tracks in piece keys.
sha2.workspace = true
# `.comp.yaml` files.
yaml_serde.workspace = true

[lints]
workspace = true

# docs.rs has no matching ffmpeg/libplacebo system libraries.
[package.metadata.docs.rs]
no-default-features = true
targets = ["x86_64-unknown-linux-gnu"]
