[package]
name = "ffcine-core"
description = "ffcine core types: errors, colour spaces, 3D LUTs, media info, 2D geometry, param tracks and expressions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/ffcine-core"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# `Error::Ffmpeg` (From<ffmpeg_next::Error>), for crates that call libav*.
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
thiserror.workspace = true
serde_json.workspace = true
ffmpeg-next = { workspace = true, optional = true }

[lints]
workspace = true

# docs.rs has no matching ffmpeg/libplacebo system libraries.
[package.metadata.docs.rs]
no-default-features = true
targets = ["x86_64-unknown-linux-gnu"]
