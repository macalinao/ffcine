[package]
name = "ffcine-stabilize"
description = "GPU stabilizer: NVIDIA optical-flow detect, trajectory smoothing, warp hook"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/ffcine-stabilize"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = ["nvof"]
# NVIDIA optical flow (NVOFA) detect on NVDEC frames. The driver libraries are loaded at run
# time, so it builds without them.
nvof = ["dep:ffmpeg-next", "dep:libloading", "ffcine-core/ffmpeg"]
# Gyro from every format telemetry-parser reads, on top of the DJI debug track `nvof` reads itself.
telemetry = ["nvof", "dep:telemetry-parser"]

[dependencies]
ffcine-core.workspace = true
serde_json.workspace = true
ffmpeg-next = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
telemetry-parser = { workspace = true, optional = true }

[lints]
workspace = true

# docs.rs has no matching ffmpeg/libplacebo system libraries.
[package.metadata.docs.rs]
no-default-features = true
targets = ["x86_64-unknown-linux-gnu"]
