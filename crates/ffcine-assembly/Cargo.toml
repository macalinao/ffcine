[package]
name = "ffcine-assembly"
description = "Final assembly: concat with dissolves, captions and title cards, chapters and cover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/ffcine-assembly"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
ffcine-core.workspace = true
ffcine-comp.workspace = true
ffcine-timeline.workspace = true
ffcine-audio.workspace = true
ffcine-render.workspace = true
ffcine-text.workspace = true
ffcine-reframe.workspace = true
ffcine-filters.workspace = true
# Parameters and the warp maths only; detect (NVOF) is the caller's (`Renderer::detect`).
ffcine-stabilize.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Path only: cargo publish drops it, so a release doesn't need ffcine-import's new version on
# crates.io first (release-plz orders publishes by normal dependencies only).
ffcine-import = { path = "../ffcine-import" }

[lints]
workspace = true

# docs.rs has no matching ffmpeg/libplacebo system libraries.
[package.metadata.docs.rs]
no-default-features = true
targets = ["x86_64-unknown-linux-gnu"]
