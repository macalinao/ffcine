[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ttf-parser unmaintained: transitive through cosmic-text (rustybuzz), no fix to take yet.
  { id = "RUSTSEC-2026-0192", reason = "transitive via cosmic-text" },
  # Unmaintained, transitive through telemetry-parser 0.2.6 (optional feature `telemetry`).
  { id = "RUSTSEC-2024-0375", reason = "atty via telemetry-parser" },
  { id = "RUSTSEC-2024-0436", reason = "paste via telemetry-parser" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "WTFPL",
  "MPL-2.0",
] # WTFPL: ffmpeg-next; MPL-2.0: mp4parse, through telemetry-parser
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# ffcine-assembly's path-only ffcine-import dev-dependency (dropped on publish).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
